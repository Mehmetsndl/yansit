# Sürüm yayınlama: "vX.Y.Z" etiketi gönderilince Windows .exe derlenir ve GitHub Release oluşturulur.
name: Sürüm yayınla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürüm numarasını doğrula
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, os, sys
          src = open("yansit.py", encoding="utf-8").read()
          ver = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if ver != tag:
              sys.exit(f"yansit.py içindeki __version__ ({ver}) etiketle ({tag}) aynı değil!")
          print("Sürüm:", ver)

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Yansit.exe derle
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --hidden-import segno --name Yansit yansit.py

      - name: Paketle
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/Yansit.exe pkg/
          Copy-Item README.md, LICENSE, CHANGELOG.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "Yansit-$v-windows.zip"

      - name: Sürüm notlarını CHANGELOG'dan çıkar
        shell: python
        run: |
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\n\[|\Z)", text, re.S)
          body = (m.group(1).strip() if m else "Ayrıntılar için CHANGELOG.md dosyasına bakın.")
          body += "\n\n---\n**İndirme:** `Yansit.exe` dosyasını indirip çalıştırın (Python gerekmez)."
          open("notes.md", "w", encoding="utf-8").write(body)

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Yansıt ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/Yansit.exe
            Yansit-${{ github.ref_name }}-windows.zip

      - name: Derlemeyi sakla (elle çalıştırmada)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Yansit-windows
          path: dist/Yansit.exe
